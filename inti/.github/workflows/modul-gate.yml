# Gerbang workflow /modul v2 (GIT-05). Jadikan "required check" di branch protection main.
# Label PR: "non-modul" (hotfix/refactor lewat /ecc:orch-*), "perawatan-modul" (mengubah penjaga /modul).
name: modul-gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test script /modul
        run: node --test scripts/modul/test/*.test.mjs
      - name: Gerbang modul (per commit)
        env:
          NON_MODUL: ${{ contains(github.event.pull_request.labels.*.name, 'non-modul') }}
          PERAWATAN: ${{ contains(github.event.pull_request.labels.*.name, 'perawatan-modul') }}
        run: node scripts/modul/check-gate.mjs origin/${{ github.base_ref }}
